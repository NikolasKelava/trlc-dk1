[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lerobot_robot_trlc_dk1"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0.1",
  "pyserial>=3.5",
  "dynamixel-sdk>=3.7.31",
  "lerobot[dynamixel,viz,molmoact2,training]>= 0.5.1",
  "mujoco>=3.0.0",
  # --- dk1lab (fork additions) ---
  "typer>=0.12",
  "tomlkit>=0.13",
  "opencv-python>=4.9",
  # `dk1 policy serve` — the /act endpoint sai-prasanna/molmoact2's sim_eval
  # talks to. Three small pure-Python packages; the model itself is lerobot's.
  "fastapi>=0.116",
  "uvicorn>=0.35",
  "json-numpy>=2.1",
]

authors = [
  {name = "Jannik Grothusen", email = "jannik@robot-learning.co"},
]
maintainers = [
  {name = "Jannik Grothusen", email = "jannik@robot-learning.co"},
]

[project.urls]
Homepage = "https://www.robot-learning.co/"
Documentation = "https://www.docs.robot-learning.co/"

# --- dk1lab (fork additions) -------------------------------------------------
# Everything this fork adds lives in the `dk1lab` package and is reached through
# the single `dk1` entry point. Upstream files are left untouched so the fork
# stays rebaseable on robot-learning-co/trlc-dk1.

[project.scripts]
dk1 = "dk1lab.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["lerobot_robot_trlc_dk1", "trlc_dk1_control", "dk1lab"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
